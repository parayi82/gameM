[build]
  publish = "."
  functions = "netlify/functions"
  command = "echo 'sin build step — sitio estático + funciones'"

[functions]
  node_bundler = "esbuild"

# Encabezados de seguridad estrictos: solo scripts propios (supabase-js va
# incluido en /vendor), solo conexiones a Supabase, sin iframes, sin caché.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
